[project]
name = "pocketrag-backend"
version = "1.0.0"
description = "Local document parsing and hybrid retrieval backend for PocketRAG"
requires-python = ">=3.12,<3.15"
dependencies = [
  "docling>=2.59.0,<3",
  "huggingface-hub>=1.2.0,<2",
  "lancedb>=0.25.0,<1",
  "pyarrow>=18.0.0,<24",
  "pypdfium2>=4.30.0,<6",
  "pillow>=11.0.0,<13",
  "python-pptx>=1.0.0,<2",
  "rapidocr>=3.4.0,<4",
  "tiktoken>=0.9.0,<1",
  "torch>=2.8.0,<3",
  "transformers>=5.0.0,<6",
]

[project.scripts]
pocketrag-backend = "pocketrag_backend.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketrag_backend"]
