name: Release macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.1.0
        required: true
        type: string
      publish:
        description: Attach the unsigned DMG to a GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Confirm release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: test "v$(node -p \"require('./package.json').version\")" = "$RELEASE_TAG"
      - name: Build unsigned DMG
        run: npm run release:dmg
      - name: Verify DMG structure
        run: npm run release:verify-dmg
      - name: Create checksum
        run: shasum -a 256 dist/RavnDock-*.dmg > dist/RavnDock-${{ inputs.tag }}.sha256
      - name: Upload release artifact
        uses: actions/upload-artifact@v6
        with:
          name: RavnDock-${{ inputs.tag }}-macOS-arm64
          path: |
            dist/RavnDock-*.dmg
            dist/RavnDock-*.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/RavnDock-*.dmg dist/RavnDock-*.sha256 --title "RavnDock $RELEASE_TAG" --notes-file docs/RELEASE_NOTES_1.1.0.md
